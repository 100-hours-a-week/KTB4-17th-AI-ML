name: Model pre-training CI

on:
  pull_request:
    paths:
      - 'adapters/**'
      - 'ci/**'
      - 'tests/pretraining/**'
      - '.github/workflows/pretraining-ci.yml'
      - 'docs/pretraining-ci.md'
  push:
    branches: [dev, 'codex/**']
    paths:
      - 'adapters/**'
      - 'ci/**'
      - 'tests/pretraining/**'
      - '.github/workflows/pretraining-ci.yml'
      - 'docs/pretraining-ci.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pretraining-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tracked adapter artifacts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CPU-only Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned CI dependencies
        id: install
        run: python -m pip install --disable-pip-version-check -r ci/requirements.txt
      - name: Compile validator and fixtures
        id: compile
        run: python -m compileall -q ci tests/pretraining
      - name: Test validator with scoped coverage
        id: tests
        run: >-
          python -m pytest tests/pretraining -q
          --junitxml=reports/tests.junit.xml
          --cov=ci --cov-config=ci/coverage.ini --cov-fail-under=95
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml
          --cov-report=json:reports/coverage.json
      - name: Audit actual adapter artifacts
        id: audit
        if: always()
        run: python ci/preflight.py --root . --output reports/preflight
      - name: Finalize reports independently of validator execution
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: >-
          python ci/finalize_reports.py --output reports
          --install-outcome "$INSTALL_OUTCOME"
          --compile-outcome "$COMPILE_OUTCOME"
          --tests-outcome "$TESTS_OUTCOME"
          --audit-outcome "$AUDIT_OUTCOME"
      - name: Publish pre-training summary
        if: always()
        run: cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pretraining-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
          if-no-files-found: error
